[build]
builder = "nixpacks"
buildCommand = "npm install && npm install --prefix server && npm install --prefix client && npm run build --prefix client"

[deploy]
startCommand = "node server/index.js"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "on_failure"

[[volumes]]
mountPath = "/data"

[environments.production.variables]
NODE_ENV = "production"
DATA_DIR = "/data"
